# DSH profile patch — applied on top of the standard web profile bundles.
#
# Sets the IANA zone the `harness:date` system-prompt section renders today's
# date in. Change to match your local zone if you're not in Central Time.
# Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
#
# This used to mount `@deepseek-ai/dsh-time-context`, which appended a fresh
# timestamp message on EVERY step of every turn (~230 bytes each, unbounded
# growth over a session — see docs/improvement-plan.md). A date that changes
# at most once a day belongs in the system prompt, not repeated in history.
- id: system-prompt
  config:
    timeZone: America/Chicago
