# DSH settings shared across the Corvus Construction team.
# Copied to %USERPROFILE%\.dsh\settings.yaml on first deploy.
# API key VALUES are never stored here — only the env-var references.
# Each user adds their own keys through Settings → Models / Settings → Plugins
# or by setting the env vars listed in ONBOARDING.md.

llm-pi-ai:
  providers:
    openrouter:
      apiKeyEnv: OPENROUTER_API_KEY
      baseURL: https://openrouter.ai/api/v1
      models:
        - id: openrouter/auto
          name: Auto Router (Best Available)
        - id: deepseek/deepseek-v4-flash-0731
          name: DeepSeek V4 Flash 0731
        - id: deepseek/deepseek-v4-pro
          name: DeepSeek V4 Pro 0423
        - id: qwen/qwen3.8-max
          name: Qwen3.8 Max
        - id: qwen/qwen3.7-flash
          name: Qwen3.7 Flash
        - id: google/gemini-3.1-flash-image
          name: Gemini Flash Image
          input: [text, image]

# Web search uses the DeepSeek API (separate from the chat API).
# Get a key at https://platform.deepseek.com and add it through
# Settings → Plugins → Web search, or set DEEPSEEK_API_KEY env var.
web-search-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY

# Default model for new sessions.
agent-default-model:
  provider: openrouter
  model: openrouter/auto

# Artifact publisher — uploads agent-generated files to Supabase Storage and
# returns a 24-hour presigned URL so the agent can share deliverables.
# Requires Corax_AI_Supabase_URL and Corax_AI_Supabase_Service_Key env vars.
# Add them to %USERPROFILE%\.dsh\.env (never commit key values here).
# The plugin self-disables gracefully when the env vars are absent.
tool-artifact-publish: {}
